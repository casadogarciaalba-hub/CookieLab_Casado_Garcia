<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CookieLab</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <main class="tarjeta">
    <h1>🍪 CookieLab</h1>
    <p id="saludo"></p>

    <!-- FASE 4 · Contador de visitas -->
    <p id="visitas" class="visitas"></p>

    <!-- FASE 3 · Preferencias -->
    <div class="preferencias">
      <label>
        Tema
        <select id="select-tema">
          <option value="oscuro">🌙 Oscuro</option>
          <option value="claro">☀️ Claro</option>
        </select>
      </label>
      <label>
        Idioma
        <select id="select-idioma">
          <option value="es">🇪🇸 Español</option>
          <option value="en">🇬🇧 English</option>
        </select>
      </label>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
